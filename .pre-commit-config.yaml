# Hooks run by prek (https://github.com/j178/prek) or pre-commit.
#   uv tool install prek && prek install
#   prek run --all-files
# Revisions are pinned to commits. Update them with `prek auto-update --freeze`
# (Dependabot also proposes updates weekly). Keep ruff-pre-commit on the same
# version as ruff in uv.lock so the hook and CI agree.

# Bytes matter here: third-party trees, syrupy snapshots and golden files.
exclude: ^tests/(fixtures/public|golden)/|/__snapshots__/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-issue-config
      - id: check-citation-file-format

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      # Offline here; the Workflow security CI job also runs the online audits.
      - id: zizmor
        args: [--offline]
