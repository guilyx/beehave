name: Scorecard

# OpenSSF Scorecard. Results go to the Security tab and to the public API
# behind the README badge. publish_results restricts what this workflow may
# contain (no top-level env, no write permissions outside the job below, and
# only a short list of actions), so keep it minimal.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read workflow runs for the CI-Tests and Dangerous-Workflow checks
      security-events: write # upload the SARIF results
      id-token: write # publish the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
