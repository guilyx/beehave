name: Release

# Every push to main is released when its Conventional Commits ask for it:
# feat bumps the minor version, fix and perf the patch version, and a breaking
# change the major version (the minor version while we are at 0.x). The bot
# commits the new version and changelog, tags it and publishes it. Pushing a
# vX.Y.Z tag by hand still releases that tag. See CONTRIBUTING.md.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions: {}

# One release at a time, never cancelled half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] works with every linter
    permissions:
      contents: read

  version:
    name: Work out the version
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit and its tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.ref_type == 'branch' }}
        with:
          fetch-depth: 0 # every commit and tag, to find the last release
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: ${{ github.ref_type == 'branch' }}
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Work out the next version from the commits
        id: next
        if: ${{ github.ref_type == 'branch' }}
        run: |
          version="$(uv run --no-project python scripts/release.py next)"
          if [ -n "$version" ]; then
            echo "Next release: $version" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No feat, fix, perf or breaking change since the last release: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push the release
        id: release
        if: ${{ steps.next.outputs.version != '' }}
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer push to main has its own run, queued behind this one; it releases instead.
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to ${remote_main}; the run for that commit releases instead."
            exit 0
          fi
          uv version "$VERSION" --no-sync
          uv run --no-project python scripts/release.py changelog "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --all --message "chore(release): $VERSION"
          git tag --annotate "v$VERSION" --message "Beehave $VERSION"
          gh auth setup-git
          # Pushes made with this token start no workflow, so this does not loop.
          git push --atomic origin HEAD:main "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pick the tag to release
        id: tag
        env:
          PUSHED: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          CREATED: ${{ steps.release.outputs.tag }}
        run: echo "tag=${PUSHED:-$CREATED}" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: [ci, version]
    if: ${{ needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          # Never restore a cache into a build that gets published.
          enable-cache: false

      - name: Check that the tag matches the project version
        run: |
          version="$(uv --color never version --short)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match version ${version} in pyproject.toml"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section, or it is empty"
            exit 1
          fi
          cat release-notes.md

      - name: Build the sdist and the wheel
        run: uv build --no-sources

      - name: Smoke-test the wheel
        working-directory: ${{ runner.temp }}
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/smoke/bin/beehave" --version
          "$RUNNER_TEMP/smoke/bin/beehave" graph "$GITHUB_WORKSPACE/examples/aerial/drone_mission.xml" -q

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/beehave-bt
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations; no API token is stored
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  github-release:
    name: Sign and create the GitHub Release
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign with Sigstore
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Sign the distributions
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          # The next step attaches the bundles; this only works on release events.
          release-signing-artifacts: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          prerelease=()
          if [[ "${TAG}" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Beehave ${TAG}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}"
